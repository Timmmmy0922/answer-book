name: Deploy to GitHub Pages

# 推到 main 就自动重新部署。
# 这一份只负责「把网页放到公网上」；资料库那边走 Supabase，与此无关。
#
# ⚠️ 提醒：GitHub Pages（*.github.io）在中国大陆打不开。
#    这份 workflow 是给「海外访客」用的。
#    如果要让国内访客免翻墙打开，请改用腾讯云 EdgeOne Pages 等方案，
#    做法见 README 第 6 节。程式码本身不用改，静态导出是同一套。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      BASE_PATH: "/answer-book"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 建置（静态导出）
        run: npm run build

      - name: 检查产物
        run: |
          set -e
          test -f out/index.html || { echo "::error::out/index.html 不存在，静态导出没成功"; exit 1; }
          echo "导出成功，文件数：$(find out -type f | wc -l)"

          grep -q "迷路的旅人" out/index.html && echo "✓ 页面文案"
          grep -q "/answer-book/_next/" out/index.html && echo "✓ basePath 前缀"

          test -f out/fonts/noto-serif-sc.css || { echo "::error::字体 CSS 没被导出"; exit 1; }
          echo "✓ 自托管字体：$(find out/fonts -name '*.woff2' | wc -l) 个切片"

          # 关键防线：产物里绝对不能再出现 Google 的域名，否则国内访客会卡在这里
          if grep -rlE "fonts\.(googleapis|gstatic)\.com" out/ ; then
            echo "::error::产物里还有 Google Fonts 连线，国内会打不开"
            exit 1
          fi
          echo "✓ 产物内无任何 Google Fonts 连线"

      - name: 关掉 Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
